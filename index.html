<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <meta name="theme-color" content="#0f172a" />

  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <link rel="manifest" href="./manifest.json" />

  <title>PWA Sederhana</title>

  <style>
    :root {
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      display: grid;
      place-items: center;
      padding: 16px;
    }

    .app {
      width: min(100%, 420px);
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.5rem;
    }

    p {
      margin: 0 0 16px;
      color: #9ca3af;
      line-height: 1.5;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 16px;
    }

    .status.online {
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
    }

    .status.offline {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: currentColor;
    }

    .counter {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin: 24px 0;
    }

    .counter button {
      width: 56px;
      height: 56px;
      border: 0;
      border-radius: 16px;
      background: #2563eb;
      color: white;
      font-size: 1.8rem;
      font-weight: 700;
      cursor: pointer;
    }

    .counter button:active {
      transform: scale(0.96);
    }

    #count {
      min-width: 72px;
      text-align: center;
      font-size: 2.2rem;
      font-weight: 800;
    }

    .install {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 14px;
      background: #22c55e;
      color: #052e16;
      font-weight: 800;
      cursor: pointer;
    }

    .hint {
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>PWA Native Sederhana</h1>
    <p>
      Website ini bisa dijalankan offline dan dipasang ke homescreen
      seperti aplikasi native.
    </p>

    <div id="status" class="status offline">
      <span class="dot"></span>
      <span id="statusText">Cek koneksi...</span>
    </div>

    <div class="counter">
      <button id="minus" aria-label="Kurangi">−</button>
      <span id="count">0</span>
      <button id="plus" aria-label="Tambah">+</button>
    </div>

    <button id="installBtn" class="install" hidden>
      Install ke Homescreen
    </button>

    <p class="hint">
      Angka tersimpan di localStorage. Coba matikan internet lalu refresh halaman.
    </p>
  </main>

  <script>
    // Registrasi Service Worker
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker
          .register("./sw.js")
          .then((registration) => {
            console.log("Service Worker terdaftar:", registration.scope);
          })
          .catch((error) => {
            console.warn("Gagal register Service Worker:", error);
          });
      });
    }

    // Status online/offline
    const statusEl = document.getElementById("status");
    const statusText = document.getElementById("statusText");

    function updateStatus() {
      const online = navigator.onLine;

      statusEl.classList.toggle("online", online);
      statusEl.classList.toggle("offline", !online);

      statusText.textContent = online ? "Online" : "Offline";
    }

    window.addEventListener("online", updateStatus);
    window.addEventListener("offline", updateStatus);

    updateStatus();

    // Counter sederhana dengan localStorage
    const countEl = document.getElementById("count");

    let count = Number(localStorage.getItem("pwa-count") || 0);

    function render() {
      countEl.textContent = count;
      localStorage.setItem("pwa-count", String(count));
    }

    document.getElementById("plus").addEventListener("click", () => {
      count++;
      render();
    });

    document.getElementById("minus").addEventListener("click", () => {
      count--;
      render();
    });

    render();

    // Tombol install PWA
    const installBtn = document.getElementById("installBtn");
    let deferredPrompt = null;

    window.addEventListener("beforeinstallprompt", (event) => {
      event.preventDefault();
      deferredPrompt = event;
      installBtn.hidden = false;
    });

    installBtn.addEventListener("click", async () => {
      if (!deferredPrompt) return;

      deferredPrompt.prompt();

      const choice = await deferredPrompt.userChoice;

      if (choice.outcome === "accepted") {
        installBtn.hidden = true;
      }

      deferredPrompt = null;
    });

    window.addEventListener("appinstalled", () => {
      installBtn.hidden = true;
    });
  </script>
</body>
</html>
